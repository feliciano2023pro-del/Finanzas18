<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Finanzas</title>
    
    <!-- ENLACES DE LA PWA (MANIFEST) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(rgba(10, 15, 12, 0.85), rgba(10, 15, 12, 0.92)), 
                        url('fondo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- PANTALLA DE CARGA 3D --- */
        #intro-animacion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0f0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .heart-3d-container {
            width: 180px;
            height: 180px;
            position: relative;
            transform-style: preserve-3d;
            animation: girar3D 4s infinite linear;
        }

        .heart-3d-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(76, 175, 80, 0.6));
            border-radius: 50%;
        }

        @keyframes girar3D {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            50% { transform: rotateY(180deg) rotateX(-10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        .intro-texto {
            margin-top: 25px;
            color: #4caf50;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            width: 100%;
            max-width: 480px;
        }

        h1.titulo-principal {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: #4caf50;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-mini {
            background-color: rgba(20, 30, 25, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card-mini.azul { border-bottom: 4px solid #2196f3; }
        .card-mini.rojo { border-bottom: 4px solid #e53935; }

        .card-mini h4 {
            font-size: 0.8rem;
            color: #b0b0b0;
            margin-bottom: 4px;
        }

        .card-mini p {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .card-mini.azul p { color: #2196f3; }
        .card-mini.rojo p { color: #e53935; }

        .form-group, .filter-group {
            background-color: rgba(20, 30, 25, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #b0b0b0;
            margin-bottom: 6px;
            margin-top: 10px;
        }

        label:first-child { 
            margin-top: 0; 
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: rgba(15, 20, 18, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus { 
            border-color: #4caf50; 
        }

        input[type="date"] {
            cursor: pointer;
        }

        .btn-registrar {
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
        }

        .btn-reiniciar {
            width: 100%;
            background-color: rgba(30, 20, 20, 0.85);
            color: #ff5252;
            border: 1px solid #ff5252;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        h3.seccion-historial {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .filtros-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .resumen-anio-card {
            background: rgba(33, 150, 243, 0.15);
            border: 1px solid #2196f3;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        ul { 
            list-style: none; 
        }

        li {
            background-color: rgba(20, 30, 25, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #777;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        li.ahorro { border-left-color: #2196f3; }
        li.gasto { border-left-color: #e53935; }

        .info-mov { 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
        }

        .desc { 
            font-weight: bold; 
            font-size: 0.95rem; 
        }

        .tipo-tag { 
            font-size: 0.75rem; 
            color: #aaaaaa; 
        }

        .monto-txt { 
            font-weight: bold; 
            font-size: 0.95rem; 
            margin-top: 2px; 
        }

        .fecha-txt { 
            font-size: 0.7rem; 
            color: #888; 
        }

        .delete-btn { 
            background: none; 
            border: none; 
            font-size: 1.2rem; 
            cursor: pointer; 
            padding: 4px; 
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FS345MNTPH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FS345MNTPH');
    </script>
</head>
<body>

    <!-- PANTALLA DE CARGA 3D -->
    <div id="intro-animacion">
        <div class="heart-3d-container">
            <img src="fondo.jpg" alt="Fondo">
        </div>
        <div class="intro-texto">Cargando Finanzas...</div>
    </div>

    <div class="container">
        <h1 class="titulo-principal">Control de Finanzas</h1>

        <div class="grid-cards">
            <div class="card-mini azul">
                <h4>Total Ahorros (Disponible)</h4>
                <p id="totalAhorros">Bs. 0.00</p>
            </div>
            <div class="card-mini rojo">
                <h4>Total Gastos/Emerg.</h4>
                <p id="totalGastos">Bs. 0.00</p>
            </div>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" placeholder="Ej. Pollo, Sueldo">

            <label for="monto">Monto (Bs.):</label>
            <input type="number" id="monto" placeholder="Ej. 15" step="any">

            <label for="tipo">Seleccionar Acción:</label>
            <select id="tipo">
                <option value="ahorro">🏦 Bolsillo de Ahorro (Suma +)</option>
                <option value="gasto">🚨 Gasto / Emergencia (Resta del Ahorro -)</option>
            </select>

            <button class="btn-registrar" onclick="agregarMovimiento()">Registrar Movimiento</button>
        </div>

        <button class="btn-reiniciar" onclick="reiniciarTodo()">⚠️ Borrar todo y empezar de cero</button>

        <h3 class="seccion-historial">Historial y Filtros Temporales</h3>
        
        <div class="filter-group">
            <label>Filtrar por Año y Mes:</label>
            <div class="filtros-container">
                <select id="filtroAnio" onchange="actualizarHistorial()">
                    <option value="todos">Todos los Años</option>
                </select>
                <select id="filtroMes" onchange="actualizarHistorial()">
                    <option value="todos">Todos los Meses</option>
                    <option value="0">Enero</option>
                    <option value="1">Febrero</option>
                    <option value="2">Marzo</option>
                    <option value="3">Abril</option>
                    <option value="4">Mayo</option>
                    <option value="5">Junio</option>
                    <option value="6">Julio</option>
                    <option value="7">Agosto</option>
                    <option value="8">Septiembre</option>
                    <option value="9">Octubre</option>
                    <option value="10">Noviembre</option>
                    <option value="11">Diciembre</option>
                </select>
            </div>
            <label for="filtroDia">Filtrar por Día Específico:</label>
            <input type="date" id="filtroDia" onchange="actualizarHistorial()" style="margin-top: 5px;">
        </div>

        <div id="resumenAnioBox" class="resumen-anio-card" style="display: none;">
            <div>
                <strong id="tituloAnioActivo">Año: 2026</strong><br>
                <span style="font-size: 0.75rem; color: #aaa;">Balance anual</span>
            </div>
            <div style="text-align: right;">
                <span style="color: #2196f3;" id="AnioAhorro">Ahorros: Bs. 0.00</span><br>
                <span style="color: #e53935;" id="AnioGasto">Gastos: Bs. 0.00</span>
            </div>
        </div>

        <ul id="listaMovimientos"></ul>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-animacion');
                intro.style.opacity = '0';
                setTimeout(() => { intro.style.display = 'none'; }, 800);
            }, 2000);
            
            poblarFiltroAnios();
            actualizarHistorial();
        });

        let movimientos = JSON.parse(localStorage.getItem('movimientos_finanzas')) || [];

        function guardarDatos() {
            localStorage.setItem('movimientos_finanzas', JSON.stringify(movimientos));
        }

        function agregarMovimiento() {
            const desc = document.getElementById('descripcion').value.trim();
            const monto = parseFloat(document.getElementById('monto').value);
            const tipo = document.getElementById('tipo').value;

            if (!desc || isNaN(monto) || monto <= 0) {
                alert("Por favor, completa una descripción válida y un monto mayor a 0.");
                return;
            }

            const ahora = new Date();
            const nuevoMov = {
                id: Date.now(),
                descripcion: desc,
                monto: monto,
                tipo: tipo,
                anio: ahora.getFullYear(),
                mes: ahora.getMonth(),
                diaStr: ahora.toISOString().split('T')[0],
                fechaCompletaText: ahora.toLocaleString('es-BO', { dateStyle: 'medium', timeStyle: 'short' })
            };

            movimientos.unshift(nuevoMov);
            guardarDatos();
            limpiarFormulario();
            poblarFiltroAnios();
            actualizarHistorial();
        }

        function limpiarFormulario() {
            document.getElementById('descripcion').value = '';
            document.getElementById('monto').value = '';
        }

        function eliminarMovimiento(id) {
            movimientos = movimientos.filter(m => m.id !== id);
            guardarDatos();
            poblarFiltroAnios();
            actualizarHistorial();
        }

        function reiniciarTodo() {
            if (confirm("¿Estás seguro de borrar todo y empezar de cero?")) {
                movimientos = [];
                guardarDatos();
                poblarFiltroAnios();
                actualizarHistorial();
            }
        }

        function poblarFiltroAnios() {
            const selectAnio = document.getElementById('filtroAnio');
            const aniosUnicos = [...new Set(movimientos.map(m => m.anio))].sort((a,b) => b - a);
            
            let opcionesHTML = '<option value="todos">Todos los Años</option>';
            aniosUnicos.forEach(anio => {
                opcionesHTML += `<option value="${anio}">${anio}</option>`;
            });
            selectAnio.innerHTML = opcionesHTML;
        }

        function actualizarHistorial() {
            const filtroAnio = document.getElementById('filtroAnio').value;
            const filtroMes = document.getElementById('filtroMes').value;
            const filtroDia = document.getElementById('filtroDia').value;

            let totalA = 0;
            let totalG = 0;

            movimientos.forEach(m => {
                if (m.tipo === 'ahorro') {
                    totalA += m.monto;
                } else {
                    totalA -= m.monto; 
                    totalG += m.monto;
                }
            });

            document.getElementById('totalAhorros').innerText = `Bs. ${totalA.toFixed(2)}`;
            document.getElementById('totalGastos').innerText = `Bs. ${totalG.toFixed(2)}`;

            const resumenBox = document.getElementById('resumenAnioBox');
            if (filtroAnio !== 'todos') {
                let anioAhorro = 0;
                let anioGasto = 0;
                movimientos.filter(m => m.anio.toString() === filtroAnio).forEach(m => {
                    if (m.tipo === 'ahorro') anioAhorro += m.monto;
                    else anioGasto += m.monto;
                });

                document.getElementById('tituloAnioActivo').innerText = `Año: ${filtroAnio}`;
                document.getElementById('AnioAhorro').innerText = `Ahorros: Bs. ${anioAhorro.toFixed(2)}`;
                document.getElementById('AnioGasto').innerText = `Gastos: Bs. ${anioGasto.toFixed(2)}`;
                resumenBox.style.display = 'flex';
            } else {
                resumenBox.style.display = 'none';
            }

            const lista = document.getElementById('listaMovimientos');
            lista.innerHTML = '';

            const filtrados = movimientos.filter(m => {
                let coincideAnio = (filtroAnio === 'todos' || m.anio.toString() === filtroAnio);
                let coincideMes = (filtroMes === 'todos' || m.mes.toString() === filtroMes);
                let coincideDia = (!filtroDia || m.diaStr === filtroDia);
                return coincideAnio && coincideMes && coincideDia;
            });

            if (filtrados.length === 0) {
                lista.innerHTML = `<li style="justify-content: center; color: #888; font-size: 0.85rem;">No hay movimientos en este periodo.</li>`;
                return;
            }

            filtrados.forEach(m => {
                const li = document.createElement('li');
                li.className = m.tipo === 'ahorro' ? 'ahorro' : 'gasto';

                const signo = m.tipo === 'ahorro' ? '+ Bs.' : '- Bs.';
                const colorMonto = m.tipo === 'ahorro' ? '#2196f3' : '#e53935';

                li.innerHTML = `
                    <div class="info-mov">
                        <span class="desc">${m.descripcion}</span>
                        <span class="tipo-tag">${m.tipo === 'ahorro' ? '🏦 Bolsillo de Ahorro' : '🚨 Gasto / Emergencia'}</span>
                        <span class="monto-txt" style="color: ${colorMonto};">${signo} ${m.monto.toFixed(2)}</span>
                        <span class="fecha-txt">📅 ${m.fechaCompletaText}</span>
                    </div>
                    <button class="delete-btn" onclick="eliminarMovimiento(${m.id})" title="Eliminar">❌</button>
                `;
                lista.appendChild(li);
            });
        }
    </script>

    <!-- REGISTRO DEL SERVICE WORKER (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker registrado con éxito."))
          .catch((err) => console.log("Error al registrar Service Worker:", err));
      }
    </script>
</body>
</html>
